<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="Fluento — Aprender línguas com IA. O teu professor pessoal de idiomas com Student Digital Twin e Learning Analytics. Aprende inglês com IA de forma inteligente." />
    
    <!-- SEO & Keywords -->
    <meta name="keywords" content="Fluento, AI language learning, aprender línguas com IA, aprender inglês com IA, AI language teacher, digital twin learning" />
    <link rel="canonical" href="https://fluento.ai/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fluento.ai/" />
    <meta property="og:title" content="Fluento — AI Language Learning | Aprender Línguas com IA" />
    <meta property="og:description" content="Fluento is your personalized AI language teacher. Master English and other languages using AI-driven immersion and digital twin technology." />
    <meta property="og:image" content="https://fluento.ai/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://fluento.ai/" />
    <meta property="twitter:title" content="Fluento — AI Language Learning" />
    <meta property="twitter:description" content="Master new languages with your personal AI teacher. Personalized paths, real-time feedback, and immersive missions." />
    <meta property="twitter:image" content="https://fluento.ai/og-image.png" />

    <!-- Favicon & PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Structured Data (Schema.org) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Fluento",
      "description": "Personalized AI language learning platform with digital twin technology.",
      "applicationCategory": "EducationApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Organization",
        "name": "Fluento AI"
      }
    }
    </script>

    <title>Fluento — AI Language Learning | Aprender Inglês com IA</title>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
